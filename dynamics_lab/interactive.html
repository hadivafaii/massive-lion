<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Dynamics Lab</title>
	<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
	<style>
		:root {
			--bg: #f7f7f4;
			--ink: #202124;
			--muted: #676b73;
			--line: #d7d4cb;
			--panel: #ffffff;
			--accent: #0f766e;
		}
		html, body {
			height: 100%;
			overflow: hidden;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			background: var(--bg);
			color: var(--ink);
			font: 14px/1.35 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
		main {
			display: grid;
			grid-template-rows: auto 1fr;
			height: 100vh;
			overflow: hidden;
		}
		header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			padding: 12px 16px;
			border-bottom: 1px solid var(--line);
			background: #fbfbf8;
		}
		h1 {
			margin: 0;
			font-size: 17px;
			font-weight: 650;
			letter-spacing: 0;
		}
		.title-tools {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			white-space: nowrap;
		}
		.title-tools button {
			padding: 5px 9px;
			font-size: 12px;
		}
		.file-status {
			color: var(--muted);
			font-size: 12px;
		}
		body.drag-config {
			outline: 2px dashed rgba(9, 128, 116, 0.55);
			outline-offset: -8px;
		}
		button, select, input {
			font: inherit;
		}
		button {
			border: 1px solid #b9b5aa;
			background: #ffffff;
			color: var(--ink);
			border-radius: 6px;
			padding: 7px 10px;
			cursor: pointer;
		}
		button.primary {
			background: var(--accent);
			color: white;
			border-color: var(--accent);
		}
		button:disabled {
			opacity: 0.45;
			cursor: default;
		}
		.shell {
			display: grid;
			grid-template-columns: 320px 1fr;
			min-height: 0;
			overflow: hidden;
		}
		.controls {
			overflow: auto;
			padding: 14px;
			border-right: 1px solid var(--line);
			background: #fdfdf9;
		}
		.stage {
			display: grid;
			grid-template-columns: minmax(380px, 0.9fr) minmax(620px, 1.35fr);
			gap: 10px;
			padding: 10px;
			min-width: 0;
			min-height: 0;
			overflow: hidden;
		}
		.side-stage {
			display: grid;
			grid-template-rows: minmax(190px, 0.82fr) minmax(210px, 1.18fr);
			gap: 10px;
			min-width: 0;
			min-height: 0;
		}
		.top-strip {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 10px;
			min-width: 0;
			min-height: 0;
		}
		.panel {
			display: grid;
			grid-template-rows: auto 1fr;
			min-width: 0;
			min-height: 0;
			background: var(--panel);
			border: 1px solid var(--line);
			border-radius: 8px;
			overflow: hidden;
		}
		.panel h2 {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
			margin: 0;
			padding: 7px 11px;
			font-size: 13px;
			font-weight: 650;
			border-bottom: 1px solid var(--line);
			background: #fbfbf8;
		}
		.panel h2 select {
			width: auto;
			min-width: 78px;
			padding: 3px 5px;
			font-size: 12px;
			font-weight: 400;
		}
		.panel h2 .subtitle {
			min-width: 0;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			color: var(--muted);
			font-size: 11px;
			font-weight: 400;
		}
		.panel-tools {
			display: inline-flex;
			align-items: center;
			gap: 5px;
			min-width: 0;
		}
		.panel-tools select {
			min-width: 62px;
		}
		.panel-tools button {
			width: 26px;
			height: 26px;
			padding: 0;
			line-height: 1;
		}
		.bounds-control {
			display: inline-flex;
			align-items: center;
			gap: 4px;
			min-width: 0;
			color: var(--muted);
			font-size: 11px;
			font-weight: 400;
		}
		.bounds-control input[type="number"] {
			width: 48px;
			padding: 2px 4px;
			font-size: 11px;
		}
		.bounds-control select {
			min-width: 48px;
			padding: 2px 4px;
			font-size: 11px;
		}
		canvas {
			display: block;
			width: 100%;
			height: 100%;
			min-width: 0;
			min-height: 0;
		}
		#landscapeCanvas {
			cursor: grab;
			touch-action: none;
		}
		#landscapeCanvas:active {
			cursor: grabbing;
		}
		fieldset {
			border: 1px solid var(--line);
			border-radius: 8px;
			margin: 0 0 12px;
			padding: 10px;
			background: white;
		}
		.display-row {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 8px;
			margin-bottom: 12px;
		}
		.display-row fieldset {
			margin: 0;
		}
		.display-row label {
			grid-template-columns: 1fr 58px;
		}
		legend {
			padding: 0 5px;
			color: var(--muted);
			font-size: 12px;
			font-weight: 650;
		}
		label {
			display: grid;
			grid-template-columns: 1fr 96px;
			align-items: center;
			gap: 8px;
			margin: 7px 0;
			color: var(--muted);
			font-size: 12px;
		}
		.controls [hidden] {
			display: none !important;
		}
		label.inline {
			grid-template-columns: auto 1fr;
			justify-content: start;
		}
		label.inline input {
			width: auto;
		}
		input, select {
			width: 100%;
			border: 1px solid #c8c4b8;
			border-radius: 6px;
			padding: 5px 6px;
			background: #fff;
			color: var(--ink);
		}
		label.tunable {
			color: var(--ink);
			font-weight: 650;
		}
		label.tunable input,
		label.tunable select {
			border-color: var(--accent);
			background: #eefaf7;
			box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.12);
		}
		label.locked {
			opacity: 0.48;
		}
		.control-hint {
			margin: 6px 0 10px;
			color: var(--muted);
			font-size: 11px;
			line-height: 1.4;
		}
		label.fixed {
			opacity: 1;
		}
		.opt-mass-fixed {
			color: var(--ink);
			font-weight: 650;
		}
		.actions {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
			margin-bottom: 12px;
			position: sticky;
			top: -14px;
			z-index: 5;
			padding: 10px 0;
			background: #fdfdf9;
			border-bottom: 1px solid var(--line);
		}
		.optimizer-row {
			border: 1px solid #cfcabf;
			border-left: 4px solid var(--accent);
			border-radius: 8px;
			padding: 9px;
			margin: 10px 0;
			background: #fbfbf8;
			box-shadow: 0 1px 0 rgba(32, 33, 36, 0.04);
		}
		.optimizer-row:first-child {
			margin-top: 0;
		}
		.optimizer-row.dragging {
			opacity: 0.48;
		}
		.optimizer-row.drag-over {
			border-color: var(--accent);
			box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.16);
		}
		.row-head {
			display: grid;
			grid-template-columns: 28px minmax(0, 1fr) auto 30px;
			gap: 8px;
			margin-bottom: 6px;
		}
        .row-title { grid-template-columns: 42px minmax(0, 1fr); }
        .row-style { grid-template-columns: 1fr 52px; }
        .opt-color { height: 29px; padding: 2px; }
        .opt-auto-title { display: block; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
		.drag-handle {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 28px;
			height: 32px;
			border: 1px solid #c8c4b8;
			border-radius: 6px;
			background: #ffffff;
			color: var(--muted);
			cursor: grab;
			font-size: 15px;
			line-height: 1;
			user-select: none;
		}
		.drag-handle:active {
			cursor: grabbing;
		}
		.status {
			color: var(--muted);
			font-size: 12px;
			white-space: nowrap;
		}
		.legend-list {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			align-items: center;
			color: var(--muted);
			font-size: 12px;
		}
		.legend-item {
			display: inline-flex;
			gap: 5px;
			align-items: center;
			cursor: pointer;
			user-select: none;
		}
		.legend-item:hover {
			text-decoration: underline;
		}
		.legend-note {
			color: var(--muted);
			font-size: 11px;
		}
		.swatch {
			width: 10px;
			height: 10px;
			border-radius: 50%;
		}
		.ensemble-only[hidden] {
			display: none;
		}
		@media (max-width: 1360px) {
			.shell {
				grid-template-columns: 1fr;
				grid-template-rows: minmax(150px, 32vh) minmax(0, 1fr);
			}
			.controls {
				min-height: 0;
				max-height: none;
				border-right: 0;
				border-bottom: 1px solid var(--line);
			}
			.stage {
				grid-template-columns: 1fr;
				grid-template-rows: minmax(380px, 55vh) minmax(560px, auto);
				overflow: auto;
			}
			.stage > .panel:first-child { min-height: 380px; }
			#landscapeCanvas { min-height: 330px; }
			.side-stage { min-height: 560px; }
		}
		@media (max-width: 780px) {
			.top-strip { grid-template-columns: 1fr; }
			.side-stage { grid-template-rows: auto auto; }
			.top-strip > .panel { min-height: 240px; }
			.side-stage > .panel { min-height: 260px; }
		}
	</style>
</head>
<body>
<main>
	<header>
		<div class="title-tools">
			<h1>Optimizer Kinematics Simulator</h1>
			<button id="exportBtn">Export</button>
			<button id="importBtn">Import</button>
			<span class="file-status" id="fileStatus" aria-live="polite"></span>
		</div>
		<div class="legend-list" id="legend"></div>
		<div class="status" id="status">idle</div>
	</header>
	<div class="shell">
		<aside class="controls">
			<div class="actions">
				<button class="primary" id="runBtn" title="Run">▶️</button>
				<button id="pauseBtn" title="Pause">⏸️</button>
				<button id="stepBackBtn" title="Step back">⏪</button>
				<button id="stepForwardBtn" title="Step forward">⏩</button>
				<button id="resetBtn" title="Reset">🔄</button>
			</div>

			<fieldset>
				<legend>Run</legend>
				<label>mode
					<select id="mode">
						<option value="parallel">parallel</option>
						<option value="serial">serial</option>
						<option value="ensemble">ensemble</option>
					</select>
				</label>
				<label class="ensemble-only" hidden>ensemble optimizer
					<select id="ensemble_optimizer">
						<option value="GD">GD</option>
						<option value="SGD">SGD</option>
						<option value="CurvatureAwareSGD">CurvatureAwareSGD</option>
						<option value="Adam">Adam</option>
						<option value="AdamW">AdamW</option>
						<option value="SecretSauceAdamW">SecretSauceAdamW</option>
						<option value="CautiousAdamW">CautiousAdamW</option>
						<option value="CurvatureAwareAdamW">CurvatureAwareAdamW</option>
						<option value="Muon">Muon</option>
						<option value="CurvatureAwareMuon">CurvatureAwareMuon</option>
						<option value="VRAdam">VRAdam</option>
						<option value="Lion" selected>Lion</option>
						<option value="CautiousLion">CautiousLion</option>
						<option value="RLion">RLion</option>
						
						<option value="Signum">Signum</option>
						<option value="MassiveLion">MassiveLion</option>
						<option value="VectorMassiveLion">VectorMassiveLion</option>
						<option value="MassiveSignum">MassiveSignum</option>
					</select>
				</label>
				<label class="ensemble-only" hidden>random starts <input id="ensemble_count" type="number" value="25" min="1" max="250" step="1"></label>
				<label class="ensemble-only" hidden>window <input id="convergence_window" type="number" value="25" min="1" max="500" step="1"></label>
				<label class="ensemble-only" hidden>frac within <input id="convergence_frac_within" type="number" value="0.8" min="0" max="1" step="0.05"></label>
				<label class="ensemble-only" hidden>epsilon <input id="convergence_epsilon" type="number" value="0.207162" min="0" step="0.005"></label>
				<label>steps <input id="max_steps" type="number" value="300" min="1" max="2000" step="1"></label>
				<label>delay ms <input id="delay_ms" type="number" value="35" min="5" max="1000" step="5"></label>
				<label>theta1 start <input id="theta0_x" type="number" value="-1.8" step="0.05"></label>
				<label>theta2 start <input id="theta0_y" type="number" value="2.3" step="0.05"></label>
			</fieldset>

			<div class="display-row">
				<fieldset>
					<legend>Display</legend>
					<label class="inline"><input id="trajectory_taper" type="checkbox" checked> taper trajectories</label>
					<label class="inline"><input id="trajectory_fade" type="checkbox" checked> fade trajectory history</label>
				</fieldset>
				<fieldset>
					<legend>Target</legend>
					<label>star size <input id="target_star_size" type="number" value="0.08" min="0" step="0.01"></label>
					<label>energy radius <input id="target_dash_radius" type="number" value="0.35" min="0" step="0.05"></label>
				</fieldset>
			</div>

			<fieldset>
				<legend>Optimizers</legend>
				<label class="inline"><input id="shared_lr" type="checkbox" checked> shared learning rate</label>
				<label>learning rate <input id="shared_lr_value" type="number" value="0.03" min="0" step="0.005"></label>
				<label class="inline"><input id="shared_mass" type="checkbox" checked> shared mass/rho</label>
				<label>mass/rho <input id="shared_mass_value" type="number" value="0.2" min="0" step="0.01"></label>
				<label class="inline"><input id="shared_beta" type="checkbox" aria-describedby="shared_parameters_hint" checked> shared betas</label>
				<p id="shared_parameters_hint" class="control-hint"></p>
				<label title="Shares the momentum-memory decay across optimizers, including the first beta in standard Adam/AdamW and Muon.">beta_mom (memory) <input id="shared_momentum_value" type="number" value="0.99" min="0" max="0.999" step="0.01"></label>
				<label title="Sets d_t = beta_mix m_(t-1) + (1-beta_mix) g_t for mixing optimizers.">beta_mix (mixing) <input id="shared_gradient_injection_value" type="number" value="0.5" min="0" max="0.999" step="0.01"></label>
				<label title="Shares second-moment or legacy geometry decay. Adaptive mass has its own tied or independent controls.">beta_var / geometry decay <input id="shared_variance_value" type="number" value="0.999" min="0" max="0.999999999999" step="0.001"></label>
				<div id="optimizerRows"></div>
				<button id="addOptimizerBtn">Add optimizer</button>
			</fieldset>

			<fieldset>
				<legend>Landscape</legend>
				<label>type
					<select id="landscape_kind">
						<option value="sloped_ravine">sloped ravine</option>
						<option value="curved_valley">curved valley</option>
					</select>
				</label>
				<label>target x <input id="target_x" type="number" value="2.2" step="0.05"></label>
				<label>target y <input id="target_y" type="number" value="0" step="0.05"></label>
				<label>x curvature <input id="along_curvature" type="number" value="0.08" step="0.01"></label>
				<label>wall curvature <input id="sharpness" type="number" value="10" step="1"></label>
				<label>centerline slope <input id="valley_tilt" type="number" value="-0.55" step="0.02"></label>
				<label>centerline offset amp <input id="valley_amp" type="number" value="0.5" step="0.05"></label>
				<label>centerline bend <input id="valley_freq" type="number" value="0" step="0.1"></label>
				<label>ripple amplitude <input id="ripple_amp" type="number" value="0.03" step="0.005"></label>
				<label>ripple frequency <input id="ripple_freq" type="number" value="6" step="0.25"></label>
				<label>outer confinement <input id="boundary" type="number" value="0.02" step="0.005"></label>
			</fieldset>

			<fieldset>
				<legend>Gradient noise</legend>
				<label class="inline"><input id="noise_enabled" type="checkbox"> noise on</label>
				<label>mode
					<select id="noise_mode">
						<option value="additive">additive</option>
						<option value="yu">Yu heavy-tail</option>
						<option value="hessian">Hessian-powered Gaussian</option>
					</select>
				</label>
				<label class="additive-noise">distribution
					<select id="noise_distribution">
						<option value="gaussian">gaussian</option>
						<option value="laplace">laplace</option>
						<option value="student_t5">student t, df=5</option>
						<option value="student_t3">student t, df=3</option>
						<option value="rademacher">rademacher</option>
					</select>
				</label>
				<label class="additive-noise">std dev <input id="noise_std" type="number" value="0" min="0" step="0.01"></label>
				<label class="yu-noise" hidden>ξ distribution
					<select id="noise_xi_distribution">
						<option value="student_t">student t</option>
						<option value="symmetric_pareto" selected>symmetric Pareto-like</option>
						<option value="gaussian">gaussian</option>
					</select>
				</label>
				<label class="yu-noise" hidden>sigma0 <input id="noise_sigma0" type="number" value="0.1" min="0" step="0.005"></label>
				<label class="yu-noise" hidden>sigma1 <input id="noise_sigma1" type="number" value="1" min="0" step="0.01"></label>
				<label class="yu-noise" hidden>tail p <input id="noise_tail_p" type="number" value="1.01" min="1.01" max="2" step="0.05"></label>
				<label class="yu-noise" hidden>tail margin <input id="noise_tail_margin" type="number" value="0.1" min="0.001" step="0.05"></label>
				<label class="yu-noise" hidden>batch size <input id="noise_batch_size" type="number" value="1" min="1" max="256" step="1"></label>
				<label class="hessian-noise" hidden title="Proportionality constant multiplying the noise covariance">covariance scale <input id="noise_hessian_scale" type="number" value="0.1" min="0" step="0.01"></label>
				<label class="hessian-noise" hidden>Hessian power <input id="noise_hessian_power" type="number" value="1" min="0" step="0.1"></label>
				<label>seed <input id="noise_seed" type="number" value="0" min="0" step="1"></label>
			</fieldset>
		</aside>

		<section class="stage">
			<div class="panel">
				<h2>
					<span>loss landscape</span>
					<span class="bounds-control" title="Landscape coordinate bounds">
						θ₁
						<input id="x_min" type="number" value="-3.4" step="0.1">
						<input id="x_max" type="number" value="3.4" step="0.1">
						θ₂
						<input id="y_min" type="number" value="-2.4" step="0.1">
						<input id="y_max" type="number" value="2.4" step="0.1">
						<select id="loss_color_scale" title="Color and contour spacing">
							<option value="linear">lin</option>
							<option value="log" selected>log</option>
						</select>
					</span>
					<span class="panel-tools">
						<select id="landscape_view" title="Landscape view">
							<option value="2d">2D</option>
							<option value="3d">3D</option>
						</select>
						<button id="landscape_zoom_out" title="Zoom out">−</button>
						<button id="landscape_zoom_in" title="Zoom in">+</button>
						<button id="landscape_reset_view" title="Reset view">⟲</button>
					</span>
				</h2>
				<canvas id="landscapeCanvas"></canvas>
			</div>
			<div class="side-stage">
				<div class="top-strip">
					<div class="panel">
						<h2><span>loss over time</span><select id="loss_scale"><option value="linear">linear</option><option value="log" selected>log</option></select></h2>
						<canvas id="lossCanvas"></canvas>
					</div>
					<div class="panel">
						<h2>position over time (θ₁)</h2>
						<canvas id="thetaCanvas"></canvas>
					</div>
					<div class="panel">
						<h2>velocity over time (Δθ₁ / η)</h2>
						<canvas id="velocityCanvas"></canvas>
					</div>
				</div>
				<div class="panel">
					<h2>relativistic kinetic momentum histogram <span class="subtitle">(p₁/ρ; vector modes use norm or RMS / ρ)</span></h2>
					<canvas id="histCanvas"></canvas>
				</div>
			</div>
		</section>
	</div>
</main>

<script>

const OPTIMIZER_BACKENDS = {

async function api(path, body = null) {
	const options = body === null ? {} : {
		method: "POST",
		headers: {"Content-Type": "application/json"},
		body: JSON.stringify(body),
	};
	const response = await fetch(path, options);
	if (!response.ok) { const error = await response.json(); throw new Error(error.error || `${path} failed`); }
	const payload = await response.json();
    if (["/api/reset", "/api/step", "/api/state"].includes(path) &&
        (!Array.isArray(payload.learners) || payload.learners.some(learner =>
            typeof learner.instance_id !== "string" || !learner.instance_id))) {
        throw new Error("The Dynamics Lab server is running an older version. Export your settings, stop the server with Ctrl-C, restart it, then reload this page and import your settings.");
    }
	return payload;
}

function numberValue(id) {
	return Number($(id).value);
}

function readConvergenceCriterion() {
	return {
		window: Math.max(1, Math.floor(numberValue("convergence_window"))),
		frac_within: Math.min(1, Math.max(0, numberValue("convergence_frac_within"))),
		epsilon: Math.max(0, numberValue("convergence_epsilon")),
	};
}

function syncRadiusFromEpsilon() {
	if (syncingConvergenceControls) return;
	const radius = dashRadiusFromEpsilon(numberValue("convergence_epsilon"));
	if (radius === null) return;
	syncingConvergenceControls = true;
	$("target_dash_radius").value = formatControlNumber(radius);
	syncingConvergenceControls = false;
}

function syncEpsilonFromRadius() {
	if (syncingConvergenceControls) return;
	const epsilon = epsilonFromDashRadius(numberValue("target_dash_radius"));
	if (epsilon === null) return;
	syncingConvergenceControls = true;
	$("convergence_epsilon").value = formatControlNumber(epsilon);
	syncingConvergenceControls = false;
}

function epsilonFromDashRadius(radius) {
	const curvature = targetDashCurvatureRef();
	if (!Number.isFinite(radius) || radius < 0 || curvature === null) return null;
	return 0.5 * curvature * radius * radius;
}

function dashRadiusFromEpsilon(epsilon) {
	const curvature = targetDashCurvatureRef();
	if (!Number.isFinite(epsilon) || epsilon < 0 || curvature === null || curvature <= 0) return null;
	return Math.sqrt(2 * epsilon / curvature);
}

function targetDashCurvatureRef() {
	const curvature = Number(landscape && landscape.curvature_ref);
	if (Number.isFinite(curvature) && curvature > 0) return curvature;
	return null;
}

function formatControlNumber(value) {
	if (!Number.isFinite(value)) return "";
	return Number(value.toPrecision(6)).toString();
}

function optimizerColor(name, fallback = "#111111") {
	name = canonicalOptimizerName(name);
	if (defaults && defaults.optimizer_colors && defaults.optimizer_colors[name]) {

	}
	return fallback;
}

function canonicalOptimizerName(name) {
	return OPTIMIZER_ALIASES[name] || name;
}

function backendOptimizerName(name) {
	name = canonicalOptimizerName(name);
	return OPTIMIZER_BACKENDS[name] || name;
}

function optimizerDefaults(name) {
	name = canonicalOptimizerName(name);
	requireKnownOptimizerName(name);
	const backendName = backendOptimizerName(name);
	const backendDefaults = defaults.optimizers[backendName];
	if (!backendDefaults) {
		throw new Error(`Missing defaults for optimizer: ${name}`);
	}
	const preset = {...backendDefaults};
	if ((OPTIMIZER_FIELDS[name] || []).includes("weight_decay")) {
		preset.weight_decay = 0;
	}
	const fixedMass = fixedMassValue(name);
	if (fixedMass !== null) preset.mass = fixedMass;
	return preset;
}

function newOptimizerInstanceId() {
    const used = new Set([...document.querySelectorAll(".optimizer-row")].map(row => row.dataset.instanceId));
    while (used.has(`optimizer-${nextInstanceId}`)) nextInstanceId += 1;
    return `optimizer-${nextInstanceId++}`;
}

function optimizerFamilyTitle(name) {
    return name;

function parameterCaption(name, field) {
    if (field === "momentum") return "beta_mom";
    if (field === "beta1") return ["Adam", "AdamW"].includes(name) ? "beta_mom" : "beta_mix";
    if (field === "beta2") return ["Adam", "AdamW"].includes(name) ? "beta_var" : "beta_mom";
    if (field === "beta3" && name === "CurvatureAwareAdamW") return "beta_var";
    if (field === "beta3" && name === "VRAdam") return "velocity penalty";
    return ({lr: "lr", weight_decay: "wd", beta_gravity: "beta_gravity"})[field] || field;
}

// Inputs are plain settings, so title selection can be checked without a browser.
function automaticOptimizerTitles(entries) {
    return entries.map((entry, index) => {
        const family = entries.filter(other => other.name === entry.name);
        const fields = [...new Set(family.flatMap(other => Object.keys(other.settings)))];
        const differing = fields.filter(field => {
            const values = family.filter(other => field in other.settings).map(other => other.settings[field]);
            return new Set(values).size > 1;
        });
        const details = differing.filter(field => field in entry.settings)
            .map(field => `${parameterCaption(entry.name, field)}=${entry.settings[field]}`);
        const title = [optimizerFamilyTitle(entry.name), ...details].join(" · ");
        const equivalent = entries.map((other, i) => ({other, i})).filter(({other}) =>
            other.name === entry.name && differing.every(field => other.settings[field] === entry.settings[field]));
        return equivalent.length > 1 ? `${title} #${equivalent.findIndex(item => item.i === index) + 1}` : title;
    });
}

function activeOptimizerSettings(row) {
    const name = row.querySelector(".opt-name").value;
    const settings = {};
    for (const field of OPTIMIZER_FIELDS[name] || []) {
        const input = row.querySelector(`.opt-${field}`);
        if (!input || input.closest(".param-row").style.display === "none" || input.hidden) continue;
        if (["foreach", "tie_mass"].includes(field)) continue;
        if (field === "mass_mode" && !row.querySelector(".opt-adaptive_mass").checked) continue;
        settings[field] = input.type === "checkbox" ? input.checked :
            input.type === "number" ? Number(input.value) : input.value;
    }
    // Tied fields are hidden controls but still active parts of the recurrence.
    if (settings.adaptive_mass === true && (OPTIMIZER_FIELDS[name] || []).includes("kappa")) {
        settings.kappa = Number(row.querySelector(".opt-kappa").value);
        settings.beta_gravity = Number(row.querySelector(".opt-beta_gravity").value);
        if (row.dataset.massMode) settings.mass_mode = row.dataset.massMode;
    }
    return {name, settings};
}

function updateOptimizerPresentation() {
    const rows = [...document.querySelectorAll(".optimizer-row")];
    const titles = automaticOptimizerTitles(rows.map(activeOptimizerSettings));
    rows.forEach((row, index) => {
        row.querySelector(".remove-opt").disabled = rows.length === 1;
        row.querySelector(".remove-opt").title = rows.length === 1 ? "Keep at least one optimizer" : "Remove";
        row.dataset.displayLabel = titles[index];
        const title = row.querySelector(".opt-label");
        // Keep a cleared field empty while typing; restore auto text on blur.
        if (row.dataset.customTitle !== "true" &&
            !(document.activeElement === title && !title.value.trim())) title.value = titles[index];
        row.querySelector(".opt-auto-title").textContent = title.value.trim() || titles[index];
        row.style.borderLeftColor = row.querySelector(".opt-color").value;
    });
    const select = $("ensemble_optimizer");
    const previous = select.value;
    select.replaceChildren();
    for (const row of rows) {
        const option = document.createElement("option");
        option.value = row.dataset.instanceId;
        option.textContent = row.querySelector(".opt-label").value.trim() || row.dataset.displayLabel;
        select.appendChild(option);
    }
    const matched = rows.find(row => row.dataset.instanceId === previous) ||
        rows.find(row => row.querySelector(".opt-name").value === canonicalOptimizerName(previous));
    if (matched) select.value = matched.dataset.instanceId;
}

function optimizerInstanceIds(specs) {
    if (specs.length === 0) throw new Error("A configuration must contain at least one optimizer.");
    const used = new Set();
    for (const spec of specs) {
        const id = spec.instance_id;
        if (id === undefined || id === null || id === "") continue;
        if (typeof id !== "string" || !/^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$/.test(id)) {
            throw new Error("Invalid optimizer instance_id.");
        }
        if (used.has(id)) throw new Error(`Duplicate optimizer instance_id: ${id}`);
        used.add(id);
    }
    return specs.map((spec, index) => {
        if (spec.instance_id) return spec.instance_id;
        let number = index + 1;
        while (used.has(`optimizer-${number}`)) number += 1;
        const id = `optimizer-${number}`;
        used.add(id);
        return id;
    });
}

function setOptimizerRowMetadata(row, spec, index) {
    row.dataset.instanceId = spec.instance_id || `optimizer-${index + 1}`;
    const legacyAlias = !spec.instance_id && ["Lion", "Signum"].includes(spec.label)
        && spec.name !== spec.label;
    row.querySelector(".opt-label").value = legacyAlias ? "" : (spec.label || "");
    row.dataset.customTitle = String(Boolean(row.querySelector(".opt-label").value.trim()));
    if (spec.color) row.querySelector(".opt-color").value = normalizedOptimizerColor(spec.color);
}

function normalizedOptimizerColor(color) {
    if (/^#[0-9a-f]{3}$/i.test(color)) return "#" + [...color.slice(1)].map(char => char + char).join("").toLowerCase();
    return color.toLowerCase();
}

function duplicateOptimizerRow(source) {
    const row = addOptimizerRow(source.querySelector(".opt-name").value);
    row.dataset.customTitle = source.dataset.customTitle || "false";
    for (const input of source.querySelectorAll("input, select")) {
        const className = [...input.classList].find(name => name.startsWith("opt-"));
        const target = row.querySelector(`.${className}`);
        target.value = input.value;
        if (input.type === "checkbox") target.checked = input.checked;
    }
    const usedColors = new Set([...document.querySelectorAll(".optimizer-row")].map(item => item.querySelector(".opt-color").value));
    const freshColor = COLOR_CHOICES.find(color => !usedColors.has(color));
    row.querySelector(".opt-color").value = freshColor || COLOR_CHOICES[(COLOR_CHOICES.indexOf(source.querySelector(".opt-color").value) + 1) % COLOR_CHOICES.length];
    $("optimizerRows").insertBefore(row, source.nextSibling);
    updateOptimizerRow(row);
    needsReset = true;
}

    const rows = [...document.querySelectorAll(".optimizer-row")];
    rows.forEach((row, index) => {
        if (specs[index].color) return;
        const name = row.querySelector(".opt-name").value;
        const color = overrides[row.dataset.instanceId] || overrides[`learner-${index}`] || overrides[`${name}-${index}`] || overrides[name];
        if (/^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(color || "")) row.querySelector(".opt-color").value = normalizedOptimizerColor(color);
    });
    colorOverrides = {};
}

function setupOptimizerDrag(row) {
	const handle = row.querySelector(".drag-handle");
	handle.addEventListener("dragstart", event => {
		row.classList.add("dragging");
		event.dataTransfer.effectAllowed = "move";
		event.dataTransfer.setData("text/plain", "");
	});
	handle.addEventListener("dragend", () => {
		row.classList.remove("dragging");
		for (const item of document.querySelectorAll(".optimizer-row.drag-over")) {
			item.classList.remove("drag-over");
		}
		needsReset = true;
		updateSharedLocks();
	});
	row.addEventListener("dragover", event => {
		event.preventDefault();
		const dragging = document.querySelector(".optimizer-row.dragging");
		if (!dragging || dragging === row) return;
		row.classList.add("drag-over");
		const rect = row.getBoundingClientRect();
		const after = event.clientY > rect.top + rect.height / 2;
		$("optimizerRows").insertBefore(dragging, after ? row.nextSibling : row);
	});
	row.addEventListener("dragleave", () => {
		row.classList.remove("drag-over");
	});
	row.addEventListener("drop", event => {
		event.preventDefault();
		row.classList.remove("drag-over");
		needsReset = true;
		updateSharedLocks();
	});
}

function setOptimizerRowValues(row, preset) {
    for (const field of ["lr", "momentum", "beta1", "beta2", "beta3", "eps", "mass", "weight_decay"]) {
        row.querySelector(`.opt-${field}`).value = preset[field] ?? (field === "eps" ? 1e-8 : 0);
    }
    row.querySelector(".opt-kappa").value = preset.kappa ?? preset.beta2;
    row.querySelector(".opt-beta_gravity").value = preset.beta_gravity ?? preset.beta2;
    row.querySelector(".opt-update_mode").value = preset.update_mode ?? "coordinate";
    row.querySelector(".opt-mass_mode").value = preset.mass_mode ?? "momentum_diff";
    row.querySelector(".opt-kinematics").value = preset.kinematics ?? "minkowski";
    row.querySelector(".opt-adaptive_mass").checked = preset.adaptive_mass ?? false;
    row.querySelector(".opt-tie_mass").checked = preset.tie_mass ?? true;
    row.querySelector(".opt-foreach").checked = preset.foreach ?? true;
}

function updateOptimizerRow(row) {
    const name = row.querySelector(".opt-name").value;
    const fields = new Set(OPTIMIZER_FIELDS[name] || []);
    row.style.borderLeftColor = row.querySelector(".opt-color").value;
    for (const field of ["momentum", "beta1", "beta2", "beta3", "beta_gravity"]) {
        row.querySelector(`.param-${field} .param-caption`).textContent = parameterCaption(name, field);
    }
    for (const label of row.querySelectorAll(".param-row")) {
        const field = [...label.classList].find(c => c.startsWith("param-") && c !== "param-row").slice(6);
        label.style.display = fields.has(field) ? "grid" : "none";
    }
    row.querySelector(".opt-beta3").max = name === "CurvatureAwareAdamW" ? "0.999999999999" : "";
    updateSharedLocks();
}

function sharedMomentumField(name) {
	if (name === "CurvatureAwareSGD" || name === "CurvatureAwareAdamW" || name === "SecretSauceAdamW" || name === "CurvatureAwareMuon" || name === "Lion" || name === "CautiousLion" || name === "RLion" || name === "MassiveLion" || name === "VectorMassiveLion") return "beta2";
	if (name === "Adam" || name === "AdamW" || name === "CautiousAdamW" || name === "Muon" || name === "VRAdam") return "beta1";
	if (name === "SGD" || name === "Signum" || name === "MassiveSignum") return "momentum";
	return null;
}

function sharedGradientInjectionField(name) {
    return ["CurvatureAwareSGD", "CurvatureAwareAdamW", "CurvatureAwareMuon", "Lion", "CautiousLion", "RLion", "MassiveLion", "VectorMassiveLion"].includes(name) ? "beta1" : null;
}

function sharedMassField(name) {
	if (name === "RLion" || name === "MassiveLion" || name === "VectorMassiveLion" || name === "MassiveSignum") return "mass";
	return null;
}

function sharedVarianceField(name) {
    if (["Adam", "AdamW", "CautiousAdamW", "VRAdam"].includes(name)) return "beta2";
    return name === "CurvatureAwareAdamW" ? "beta3" : null;
}

function fixedMassValue(name) {
    return ["Lion", "Signum", "SecretSauceAdamW"].includes(name) ? 0 : null;
}

function syncSharedOptimizerValues() {
	const lockLr = $("shared_lr").checked;
	const lockMass = $("shared_mass").checked;
	const lockBetas = $("shared_beta").checked;
	if (!lockLr && !lockMass && !lockBetas) return;
	const sharedLr = $("shared_lr_value").value;
	const sharedMomentum = $("shared_momentum_value").value;
	const sharedGradientInjection = $("shared_gradient_injection_value").value;
	const sharedMass = $("shared_mass_value").value;
	const sharedVariance = $("shared_variance_value").value;
	for (const row of document.querySelectorAll(".optimizer-row")) {
		if (lockLr) row.querySelector(".opt-lr").value = sharedLr;
		const name = row.querySelector(".opt-name").value;
		const massField = sharedMassField(name);
		if (lockMass && massField !== null) {
			row.querySelector(`.opt-${massField}`).value = sharedMass;
		}
		if (!lockBetas) continue;
		const momentumField = sharedMomentumField(name);
		if (momentumField !== null) {
			row.querySelector(`.opt-${momentumField}`).value = sharedMomentum;
		}
		const injectionField = sharedGradientInjectionField(name);
		if (injectionField !== null) {
			row.querySelector(`.opt-${injectionField}`).value = sharedGradientInjection;
		}
		const varianceField = sharedVarianceField(name);
		if (varianceField !== null) {
			row.querySelector(`.opt-${varianceField}`).value = sharedVariance;
		}
	}
}

function updateSharedLocks() {
    const shared = $("shared_beta").checked;
    const sharedMass = $("shared_mass").checked;
    $("shared_lr_value").disabled = !$("shared_lr").checked;
    $("shared_mass_value").disabled = !sharedMass;
    for (const id of ["shared_momentum_value", "shared_gradient_injection_value", "shared_variance_value"]) {
        $(id).disabled = !shared;
    }
    $("shared_parameters_hint").textContent = shared
        ? "Shared betas apply to matching fields in each optimizer."
        : "Shared betas are off. Edit beta values in each optimizer below.";
    syncSharedOptimizerValues();
    for (const row of document.querySelectorAll(".optimizer-row")) {
        const name = row.querySelector(".opt-name").value;
        row.querySelector(".opt-lr").disabled = $("shared_lr").checked;
        for (const field of ["momentum", "beta1", "beta2", "beta3", "mass"]) {
            row.querySelector(`.opt-${field}`).disabled =
                (sharedMass && sharedMassField(name) === field) ||
                (shared && [sharedMomentumField(name), sharedGradientInjectionField(name), sharedVarianceField(name)].includes(field));
        }
        updateMassLocks(row, name);
    }
    updateOptimizerPresentation();
    updateControlHighlights();
}

function updateMassLocks(row, name) {
    if (!["MassiveLion", "VectorMassiveLion"].includes(name)) return;
    const adaptive = row.querySelector(".opt-adaptive_mass").checked;
    const tied = row.querySelector(".opt-tie_mass").checked;
    const beta = row.querySelector(".opt-beta2").value;
    for (const field of ["kappa", "beta_gravity"]) {
        const input = row.querySelector(`.opt-${field}`);
        input.disabled = !adaptive || tied;
        input.closest(".param-row").style.display = adaptive && !tied ? "grid" : "none";
        if (tied) input.value = beta;
    }
    row.querySelector(".opt-tie_mass").disabled = !adaptive;
    const recurrence = row.querySelector(".opt-mass_mode");
    if (recurrence) recurrence.disabled = !adaptive;
}

function updateControlHighlights() {
	for (const label of document.querySelectorAll(".controls label")) {
		const input = label.querySelector("input:not([type='checkbox']), input[type='checkbox']:disabled, select");
		if (!input || label.offsetParent === null) {
			label.classList.remove("locked", "tunable");
			continue;
		}
		label.classList.toggle("locked", input.disabled);
		label.classList.toggle("tunable", !input.disabled);
	}
}

function updateModeControls() {
	const ensemble = $("mode").value === "ensemble";
	for (const item of document.querySelectorAll(".ensemble-only")) {
		item.hidden = !ensemble;
	}
	updateControlHighlights();
}

function applyLandscapePreset(kind) {
	const preset = LANDSCAPE_PRESETS[kind];
	if (!preset) return;
	for (const [id, value] of Object.entries(preset)) {
		$(id).value = value;
	}
	updateControlHighlights();
}

function applyYuNoiseDefaults() {
	$("noise_xi_distribution").value = YU_NOISE_DEFAULTS.xi_distribution;
	setNumber("noise_sigma0", YU_NOISE_DEFAULTS.sigma0);
	setNumber("noise_sigma1", YU_NOISE_DEFAULTS.sigma1);
	setNumber("noise_tail_p", YU_NOISE_DEFAULTS.tail_p);
	setNumber("noise_tail_margin", YU_NOISE_DEFAULTS.tail_margin);
	setNumber("noise_batch_size", YU_NOISE_DEFAULTS.batch_size);
}

function applyHessianNoiseDefaults() {
	setNumber("noise_hessian_scale", HESSIAN_NOISE_DEFAULTS.hessian_scale);
	setNumber("noise_hessian_power", HESSIAN_NOISE_DEFAULTS.hessian_power);
}

function updateNoiseControls() {
	const enabled = $("noise_enabled").checked;
	const mode = $("noise_mode").value;
	$("noise_mode").disabled = !enabled;
	setNoiseGroup(".additive-noise", !enabled || mode !== "additive");
	setNoiseGroup(".yu-noise", !enabled || mode !== "yu");
	setNoiseGroup(".hessian-noise", !enabled || mode !== "hessian");

}

function setNoiseGroup(selector, hidden) {
	for (const item of document.querySelectorAll(selector)) {
		item.hidden = hidden;
		for (const control of item.querySelectorAll("input, select")) {
			control.disabled = hidden;
		}
